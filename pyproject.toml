[project]
name = "energy-tail-audit"
version = "0.1.0"
description = "Synthetic shortcut-energy audits for Transformer-structured energy models."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "matplotlib",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
