[project]
name = "best-of-n-ebm-transformer"
version = "0.1.0"
description = "Synthetic diagnostics for Best-of-N inference in Transformer-structured energy models."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "matplotlib",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

